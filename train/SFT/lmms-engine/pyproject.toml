[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmms_engine"
version = "0.1.2"
authors = [{name = "LMMs-Lab"}]
description = "FocusVTC subset of locally modified lmms-engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.8", "torchvision", "transformers==5.16.1", "accelerate>=1.10.1",
  "datasets", "pillow", "peft", "deepspeed", "loguru", "pydantic>=2", "jsonlines",
  "librosa", "soundfile", "decord", "pyyaml", "wandb", "torchdata",
  "liger-kernel>=0.7.0", "qwen-vl-utils", "einops", "pandas", "rich>=14.1",
  "hydra-core", "omegaconf", "requests", "tqdm", "numpy", "packaging",
  "huggingface-hub>=1.5.0,<2", "tokenizers>=0.23.1,<0.24",
  "safetensors>=0.8.0", "regex>=2025.10.22"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lmms_engine = ["launch/config/*.yaml"]

[project.scripts]
lmms_launch = "lmms_engine.launch.cli:main"

[project.urls]
Repository = "https://github.com/EvolvingLMMs-Lab/lmms_engine"
